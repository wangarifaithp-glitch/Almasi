services:
  - type: web
    name: almasi-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    preDeployCommand: python -m alembic upgrade head
    envVars:
      - key: APP_ENV
        value: production
      - key: API_V1_PREFIX
        value: /api/v1
      - key: APP_NAME
        value: ALMASI API
      - key: DATABASE_URL
        fromDatabase:
          name: almasi-db
          property: connectionString
      - key: AUTH_SECRET_KEY
        sync: false
      - key: CORS_ORIGINS
        value: https://almasi-frontend.onrender.com
      - key: APP_BASE_URL
        value: https://almasi-frontend.onrender.com
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false

  - type: static
    name: almasi-frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://almasi-1.onrender.com/api/v1

databases:
  - name: almasi-db
    databaseName: almasi
    user: almasi
    plan: free
